<script>
const form = document.getElementById("chat-form");
const reply = document.getElementById("reply");
const messageInput = document.getElementById("message");
const button = form.querySelector("button");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const message = messageInput.value.trim();

  if (!message) {
    reply.textContent = "Silakan tulis pesan terlebih dahulu.";
    return;
  }

  button.disabled = true;
  reply.textContent = "OneWorld sedang berpikir...";

  try {
    const response = await fetch(
      "https://late-sea-9f2b.ramsonmanalu28.workers.dev/api/chat",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: message
        })
      }
    );

    const raw = await response.text();
    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      data = { error: raw };
    }

    if (!response.ok) {
      reply.textContent = JSON.stringify(data, null, 2);
    } else {
      reply.textContent =
        data.reply || JSON.stringify(data, null, 2);
    }

  } catch (error) {
    reply.textContent = "Koneksi gagal: " + error.message;

  } finally {
    button.disabled = false;
  }
});
</script>
